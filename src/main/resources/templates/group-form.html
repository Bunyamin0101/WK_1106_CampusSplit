<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Neue Gruppe')}"> </head>
  <body class="expenses-page group-form-page">
    <header th:replace="~{fragments :: nav}"></header>
    <main>
      <section class="narrow">
        <a th:href="@{/dashboard}">← Meine Gruppen</a>
        <h1>Neue Gruppe</h1>
        <form th:action="@{/groups}" method="post" th:object="${form}">
          <div th:replace="~{fragments :: errors}"></div>
          <label
            >Gruppenname<input
              th:field="*{name}"
              maxlength="100"
              required
              placeholder="z. B. WG Sonnenallee"
            />
          </label>
          <label
            >Beschreibung (optional)<textarea
              th:field="*{description}"
              maxlength="500"
              rows="3"
            ></textarea>
          </label>
          <label
            >Gruppenwährung<select th:field="*{currency}" required aria-describedby="currency-help">
              <option value="EUR">Euro (EUR)</option>
              <option value="USD">US-Dollar (USD)</option>
            </select>
          </label>
          <small id="currency-help"
            >Zum Beispiel EUR für Euro oder USD für US-Dollar. Die Währung lässt sich später nicht ändern.</small
          >
          <button>Gruppe erstellen</button>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
  </body>
</html>
