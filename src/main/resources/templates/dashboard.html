<!doctype html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Meine Gruppen')}">
</head>
<body>
<header th:replace="~{fragments :: nav}">
</header>
<main>
<div class="heading">
<div>
<span class="eyebrow" th:text="'HALLO, ' + ${user.name}">
</span>
<h1>Meine Gruppen</h1>
<p>Alles, was ihr gemeinsam teilt, an einem Ort.</p>
</div>
<a class="button" th:href="@{/groups/new}">+ Neue Gruppe</a>
</div>
<section class="empty" th:if="${#lists.isEmpty(memberships)}">
<h2>Eure erste gemeinsame Abrechnung beginnt hier.</h2>
<p>Erstelle eine Gruppe und füge registrierte Mitglieder hinzu.</p>
<a th:href="@{/groups/new}">Gruppe erstellen →</a>
</section>
<section class="cards">
<a class="group-card" th:each="m : ${memberships}" th:href="@{/groups/{id}(id=${m.group.id})}">
<span class="pill" th:text="${m.group.currency}">
</span>
<h2 th:text="${m.group.name}">
</h2>
<p th:text="${m.group.description}">
</p>
<span th:text="${m.role.name() == 'ADMIN' ? 'Administrator' : 'Mitglied'}">
</span>
<b>Öffnen ↗</b>
</a>
</section>
</main>
<footer th:replace="~{fragments :: footer}">
</footer>
</body>
</html>
